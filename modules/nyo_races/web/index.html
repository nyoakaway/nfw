<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../modules/nyo_races/web/style.css">
    </head>
    <body>
        <raceStatus id="race-status" style="display:none;">
            <h1>1 <b><span>/</span>45</b></h1>
            <div class="timing-race">
                <div class="column">
                    <small lang="ui-racing-current-time"></small>
                    <span>00:05:00</span>
                </div>
                <div class="column">
                    <small lang="ui-racing-best-time"></small>
                    <span>00:10:00</span>
                </div>
            </div>
            <div class="race-steps">
                <i class="fa-solid fa-flag-checkered"></i>
                <span>5/10</span>
            </div>
        </raceStatus>
        
        <finishRace id="race-finish-status" style="display:none;">
            <div class="title" lang="ui-status-title"></div>
            <small lang="ui-status-subtitle"></small>
            <span>5° <span lang="ui-status-position-text"></span></span>
        
            <div class="racers">
                <div class="item">
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                    <div class="center">
                        <i class="fa-regular fa-clock"></i>
                        <sub>00:00:00</sub>
                    </div>
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                </div>
                <div class="item">
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                    <div class="center">
                        <i class="fa-regular fa-clock"></i>
                        <sub>00:00:00</sub>
                    </div>
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                </div>
                <div class="item">
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                    <div class="center">
                        <i class="fa-regular fa-clock"></i>
                        <sub>00:00:00</sub>
                    </div>
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                </div>
                <div class="item">
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                    <div class="center">
                        <i class="fa-regular fa-clock"></i>
                        <sub>00:00:00</sub>
                    </div>
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                </div>
                <div class="item">
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                    <div class="center">
                        <i class="fa-regular fa-clock"></i>
                        <sub>00:00:00</sub>
                    </div>
                    <div class="item-info">1° <span lang="ui-status-position-text"></span></div>
                </div>
            </div>
            <p><b lang="ui-status-footer-button">[esc]</b> <span lang="ui-status-footer-text"></span></p>
        </finishRace>
       
            <script src="../modules/nyo_races/web/script.js"></script>    
    </body>
</html>
